<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .transition-custom { transition: all 1000ms cubic-bezier(0.16,1,0.3,1); }
  </style>
</head>
<body class="p-10 bg-gray-100">
  <!-- Container with a fixed height and center alignment -->
  <div class="flex flex-row items-center gap-8 h-[500px] border border-red-500">
    <div class="relative flex-1 hover:flex-[1.75] h-[400px] hover:h-[500px] transition-custom rounded-[2rem] overflow-hidden bg-blue-500">
       Img 1
    </div>
    <div class="relative flex-1 hover:flex-[1.75] h-[400px] hover:h-[500px] transition-custom rounded-[2rem] overflow-hidden bg-green-500">
       Img 2
    </div>
  </div>
</body>
</html>
